<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Set Up Your Donation Page</title>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <script type="module">
    import { initBotId } from "https://esm.sh/botid/client/core";

    initBotId({
      protect: [
        { path: '/api/connect-onboarding', method: 'POST' },
      ],
    });
  </script>
  <style>
    :root { color-scheme: light; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      max-width: 520px;
      margin: 48px auto;
      padding: 0 16px;
      line-height: 1.4;
      text-align: center;
    }
    h1 { font-size: 32px; margin: 0 0 16px; }
    p { font-size: 16px; color: #444; margin-bottom: 24px; }
    .cf-turnstile { display: flex; justify-content: center; margin-bottom: 20px; }
    button {
      width: 100%;
      padding: 14px 16px;
      font-size: 22px;
      border-radius: 16px;
      border: 1px solid #d0d0d0;
      background: #d9d9d9;
      color: #222;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    #msg { margin-top: 14px; min-height: 1.4em; font-size: 15px; color: #b00020; }
    a.button {
      display: inline-block;
      width: 100%;
      box-sizing: border-box;
      padding: 14px 16px;
      font-size: 22px;
      border-radius: 16px;
      background: #d9d9d9;
      color: #222;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <h1>Set up your donation page</h1>

  <div id="noTokenState" style="display: none;">
    <p>This link is missing its setup token, so we can't verify it — probably because you navigated here directly instead of from your email.</p>
    <a class="button" href="/start">Start over →</a>
  </div>

  <div id="mainState">
    <p>Verify you're human, then connect your Stripe account to start receiving chocolate.</p>

    <!-- IMPORTANT: put your real Turnstile Site Key here, not this placeholder -->
    <div class="cf-turnstile" data-sitekey="YOUR_TURNSTILE_SITE_KEY" data-callback="onTurnstileSuccess"></div>

    <button id="continueBtn" type="button" disabled>Connect with Stripe</button>
    <p id="msg"></p>
  </div>

  <script>
    const linkToken = new URLSearchParams(window.location.search).get('token');

    if (!linkToken) {
      document.getElementById('noTokenState').style.display = 'block';
      document.getElementById('mainState').style.display = 'none';
    } else {
      let turnstileToken = null;

      window.onTurnstileSuccess = (token) => {
        turnstileToken = token;
        document.getElementById('continueBtn').disabled = false;
      };

      document.getElementById('continueBtn').onclick = async () => {
        const msg = document.getElementById('msg');
        const btn = document.getElementById('continueBtn');

        if (!turnstileToken) {
          msg.textContent = "Please complete the verification first.";
          return;
        }

        try {
          btn.disabled = true;
          msg.textContent = "Connecting to Stripe...";

          const r = await fetch('/api/connect-onboarding', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ turnstileToken, linkToken })
          });

          const data = await r.json().catch(() => ({}));

          if (!r.ok || !data.url) {
            msg.textContent = data.error || `Something went wrong (${r.status})`;
            btn.disabled = false;
            return;
          }

          window.location.assign(data.url);
        } catch (e) {
          msg.textContent = `Network error: ${e.message}`;
          btn.disabled = false;
        }
      };
    }
  </script>
</body>
</html>
