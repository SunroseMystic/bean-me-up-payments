<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Set Up Your Donation Page</title>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <style>
    :root { color-scheme: light; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      max-width: 520px;
      margin: 48px auto;
      padding: 0 16px;
      line-height: 1.4;
      text-align: center;
    }
    h1 { font-size: 32px; margin: 0 0 16px; }
    p { font-size: 16px; color: #444; margin-bottom: 24px; }
    .cf-turnstile { display: flex; justify-content: center; margin-bottom: 20px; }
    button {
      width: 100%;
      padding: 14px 16px;
      font-size: 22px;
      border-radius: 16px;
      border: 1px solid #d0d0d0;
      background: #d9d9d9;
      color: #222;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    #msg { margin-top: 14px; min-height: 1.4em; font-size: 15px; color: #b00020; }
  </style>
</head>
<body>
  <h1>Set up your donation page</h1>
  <p>Verify you're human, then connect your Stripe account to start receiving chocolate.</p>

  <div class="cf-turnstile" data-sitekey="0x4AAAAAAD3RpPpo2bMZxuut" data-callback="onTurnstileSuccess"></div>

  <button id="continueBtn" type="button" disabled>Connect with Stripe</button>
  <p id="msg"></p>

  <script>
    let turnstileToken = null;

    function onTurnstileSuccess(token) {
      turnstileToken = token;
      document.getElementById('continueBtn').disabled = false;
    }

    document.getElementById('continueBtn').onclick = async () => {
      const msg = document.getElementById('msg');
      const btn = document.getElementById('continueBtn');

      if (!turnstileToken) {
        msg.textContent = "Please complete the verification first.";
        return;
      }

      try {
        btn.disabled = true;
        msg.textContent = "Connecting to Stripe...";

        const r = await fetch('/api/connect-onboarding', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ turnstileToken })
        });

        const data = await r.json().catch(() => ({}));

        if (!r.ok || !data.url) {
          msg.textContent = data.error || `Something went wrong (${r.status})`;
          btn.disabled = false;
          return;
        }

        window.location.assign(data.url);
      } catch (e) {
        msg.textContent = `Network error: ${e.message}`;
        btn.disabled = false;
      }
    };
  </script>
</body>
</html>
