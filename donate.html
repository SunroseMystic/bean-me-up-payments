<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Donate</title>
  <style>
    :root { color-scheme: light; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      max-width: 520px;
      margin: 48px auto;
      padding: 0 16px;
      line-height: 1.4;
    }
    h1 { font-size: 44px; margin: 0 0 20px; }
    label { display: block; font-size: 22px; margin-bottom: 8px; }
    input, button {
      width: 100%;
      border-radius: 16px;
      border: 1px solid #d0d0d0;
      box-sizing: border-box;
    }
    input {
      padding: 14px 16px;
      font-size: 32px;
      margin-bottom: 16px;
    }
    button {
      padding: 14px 16px;
      font-size: 42px;
      background: #d9d9d9;
      color: #222;
      cursor: pointer;
    }
    button:disabled { opacity: 0.7; cursor: not-allowed; }
    #msg { margin-top: 14px; min-height: 1.4em; font-size: 18px; }
  </style>
</head>
<body>
  <h1>Donate</h1>

  <label for="amount">Amount (USD)</label>
  <input id="amount" type="number" min="3" step="0.01" value="3" />

  <button id="pay" type="button">Donate</button>
  <p id="msg"></p>

  <script>
    document.getElementById('pay').onclick = async () => {
      const msg = document.getElementById('msg');
      const btn = document.getElementById('pay');

      try {
        btn.disabled = true;
        msg.textContent = "Starting secure checkout...";

        const amt = parseFloat(document.getElementById('amount').value || "0");
        if (amt < 3) {
          msg.textContent = "Minimum is $3";
          return;
        }

        const params = new URLSearchParams(window.location.search);
        const destination = params.get('dest');
        if (!destination || !destination.startsWith('acct_')) {
          msg.textContent = "Missing or invalid destination account in URL.";
          return;
        }

        const r = await fetch('/api/checkout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            amount: Math.round(amt * 100),
            destination
          })
        });

        const raw = await r.text();
        let data = {};
        try { data = JSON.parse(raw); } catch (_) {}

        if (!r.ok) {
          msg.textContent = data.error || `Checkout failed (${r.status})`;
          return;
        }

        if (!data.url || !/^https:\/\/checkout\.stripe\.com\//.test(data.url)) {
          msg.textContent = "No Stripe Checkout URL returned from API.";
          return;
        }

        window.location.assign(data.url);
      } catch (e) {
        msg.textContent = `Network/client error: ${e.message}`;
      } finally {
        btn.disabled = false;
      }
    };
  </script>
</body>
</html>
