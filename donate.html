<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bean Me UP!</title>
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: light; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
    }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #fff3e6, #ffe0c2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #4a2f1c;
    }
    .card {
      background: #ffffff;
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 420px;
      width: 90%;
      margin: 24px;
      box-shadow: 0 20px 50px rgba(120, 72, 30, 0.18);
      text-align: center;
    }
    .emoji { font-size: 2.6rem; margin-bottom: 4px; }
    h1 { font-size: 36px; margin: 0 0 24px; color: #7a3e12; }
    label { display: block; font-size: 18px; margin-bottom: 8px; text-align: left; color: #6b4a30; }
    input, button {
      width: 100%;
      border-radius: 14px;
      border: 1px solid #e3c9ae;
      box-sizing: border-box;
    }
    input {
      padding: 14px 16px;
      font-size: 28px;
      margin-bottom: 16px;
      text-align: center;
      color: #4a2f1c;
    }
    button {
      padding: 14px 16px;
      font-size: 26px;
      font-weight: 700;
      background: #b5651d;
      color: #fff8f0;
      border: none;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(181, 101, 29, 0.35);
    }
    button:disabled { opacity: 0.7; cursor: not-allowed; }
    #msg { margin-top: 14px; min-height: 1.4em; font-size: 16px; color: #6b4a30; }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">🍫</div>
    <h1>Bean Me UP!</h1>

    <input id="amount" type="number"
