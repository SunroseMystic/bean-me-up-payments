<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bean Me UP!</title>
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: light; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
    }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #fff3e6, #ffe0c2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #4a2f1c;
    }
    .card {
      background: #ffffff;
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 420px;
      width: 90%;
      margin: 24px;
      box-shadow: 0 20px 50px rgba(120, 72, 30, 0.18);
      text-align: center;
      position: relative;
    }
    .back-link {
      display: inline-block;
      margin-bottom: 12px;
      font-size: 15px;
      color: #8a5a2e;
      text-decoration: none;
      cursor: pointer;
    }
    .back-link:hover { text-decoration: underline; }
    .emoji { font-size: 2.6rem; margin-bottom: 4px; }
    h1 { font-size: 36px; margin: 0 0 24px; color: #7a3e12; }
    label { display: block; font-size: 18px; margin-bottom: 8px; text-align: left; color: #6b4a30; }
    input, button {
      width: 100%;
      border-radius: 14px;
      border: 1px solid #e3c9ae;
      box-sizing: border-box;
    }
    input {
      padding: 14px 16px;
      font-size: 28px;
      margin-bottom: 16px;
      text-align: center;
      color: #4a2f1c;
    }
    button {
      padding: 14px 16px;
      font-size: 26px;
      font-weight: 700;
      background: #b5651d;
      color: #fff8f0;
      border: none;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(181, 101, 29, 0.35);
    }
    button:disabled { opacity: 0.7; cursor: not-allowed; }
    #msg { margin-top: 14px; min-height: 1.4em; font-size: 16px; color: #6b4a30; }
  </style>
</head>
<body>
  <div class="card">
    <a class="back-link" id="backLink">‹ Back</a>
    <div class="emoji">🍫</div>
    <h1>Bean Me UP!</h1>

    <label for="amount">Amount (USD)</label>
    <input id="amount" type="number" min="3" step="0.01" value="3" />

    <button id="pay" type="button">Send Fuel</button>
    <p id="msg"></p>
  </div>

  <script>
    document.getElementById('backLink').onclick = () => {
      if (document.referrer) {
        window.history.back();
      } else {
        window.location.assign('https://buymechocolate.co');
      }
    };

    document.getElementById('pay').onclick = async () => {
      const msg = document.getElementById('msg');
      const btn = document.getElementById('pay');

      try {
        btn.disabled = true;
        msg.textContent = "Starting secure checkout...";

        const amt = parseFloat(document.getElementById('amount').value || "0");
        if (amt < 3) {
          msg.textContent = "Minimum is $3";
          return;
        }

        const params = new URLSearchParams(window.location.search);
        const destination = params.get('dest');
         if (!destination || !destination.startsWith('acct_')) {
          msg.textContent = "Missing or invalid destination account in URL.";
          return;
        }

        const creatorEmail = params.get('email');

        const r = await fetch('/api/checkout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            amount: Math.round(amt * 100),
            destination,
         creatorEmail
          })
        });

        const raw = await r.text();
        let data = {};
        try { data = JSON.parse(raw); } catch (_) {}

        if (!r.ok) {
          msg.textContent = data.error || `Checkout failed (${r.status})`;
          return;
        }

        if (!data.url || !/^https:\/\/checkout\.stripe\.com\//.test(data.url)) {
          msg.textContent = "No Stripe Checkout URL returned from API.";
          return;
        }

        window.location.assign(data.url);
      } catch (e) {
        msg.textContent = `Network/client error: ${e.message}`;
      } finally {
        btn.disabled = false;
      }
    };
  </script>
</body>
</html>
