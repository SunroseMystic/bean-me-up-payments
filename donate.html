<!doctype html>
<html>
<head><meta charset="utf-8"><title>Donate</title></head>
<body style="font-family:system-ui;max-width:420px;margin:40px auto;padding:0 16px">
  <h1>Donate</h1>
  <label>Amount (USD)</label><br>
  <input id="amount" type="number" min="3" step="0.01" value="3" style="width:100%;padding:10px;margin:8px 0 12px">
  <button id="pay" style="width:100%;padding:12px;font-size:18px">Donate</button>
  <p id="msg"></p>

 <script>
  document.getElementById('pay').onclick = async () => {
    const amt = parseFloat(document.getElementById('amount').value || "0");
    if (amt < 3) return document.getElementById('msg').textContent = "Minimum is $3";

    const params = new URLSearchParams(window.location.search);
    const destination = params.get('dest');
    if (!destination || !destination.startsWith('acct_')) {
      document.getElementById('msg').textContent = "Missing or invalid destination account.";
      return;
    }

    document.getElementById('msg').textContent = "Starting secure checkout...";

    const r = await fetch('/api/create-payment-intent', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        amount: Math.round(amt * 100),
        destination
      })
    });

    const data = await r.json();
    if (!r.ok) return document.getElementById('msg').textContent = data.error || "Error starting checkout";

    if (data.url) {
      window.location.href = data.url;
    } else if (data.client_secret) {
      document.getElementById('msg').textContent = "Payment created. Missing checkout redirect URL.";
    } else {
      document.getElementById('msg').textContent = JSON.stringify(data);
    }
  };
</script>
</body>
</html>
